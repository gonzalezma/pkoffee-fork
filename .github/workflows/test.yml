name: Test Matrix
on: [push]

jobs:

  code-checks:
    runs-on: ubuntu-latest

  steps:
    - name: Checkout the code
      uses: actions/checkout@v6

    - name: Install pixi
      uses: prefix-dev/setup-pixi@v0.9.3
      with:
        pixi-version: v0.62.2

    - name: look for syntax errors
      run: pixi run ruff check